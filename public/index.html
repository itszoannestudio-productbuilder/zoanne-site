<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zoanne, a creative product builder exploring AI tools.">
  <title>Zoanne</title>
  <style>
    body {
      margin: 0;
      padding: 48px 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #1a1a1a;
      background: #ffffff;
    }
    main { max-width: 36rem; margin: 0 auto; }
    h1 { font-size: 2.25rem; line-height: 1.15; margin: 0 0 16px; }
    p { margin: 0 0 16px; }
    a { color: inherit; }
    .note { color: #666666; font-size: 16px; }
    .sticker {
      position: fixed;
      z-index: 5;
      left: clamp(24px, 12vw, 180px);
      top: clamp(210px, 38vh, 360px);
      width: min(240px, 44vw);
      height: auto;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .sticker:active { cursor: grabbing; }
    .sticker.is-dragging { filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .14)); }
    @media (prefers-reduced-motion: reduce) { .sticker { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main>
    <h1>Zoanne</h1>
    <p>Hi! I'm a product builder who studying PMUX @SKEMA &amp; POLIMI.</p>
    <p class="note">This page is the start of my site. It will change a lot.</p>
  </main>

  <img class="sticker" src="/bird-sticker.png" alt="A grey cartoon bird sticker; drag to move it" draggable="false">
  <script>
    const sticker = document.querySelector('.sticker');
    let pointerOffsetX = 0;
    let pointerOffsetY = 0;

    sticker.addEventListener('pointerdown', (event) => {
      if (event.button !== undefined && event.button !== 0) return;
      const bounds = sticker.getBoundingClientRect();
      pointerOffsetX = event.clientX - bounds.left;
      pointerOffsetY = event.clientY - bounds.top;
      sticker.setPointerCapture(event.pointerId);
      sticker.classList.add('is-dragging');
    });

    sticker.addEventListener('pointermove', (event) => {
      if (!sticker.hasPointerCapture(event.pointerId)) return;
      const maxX = window.innerWidth - sticker.offsetWidth;
      const maxY = window.innerHeight - sticker.offsetHeight;
      const x = Math.min(Math.max(0, event.clientX - pointerOffsetX), maxX);
      const y = Math.min(Math.max(0, event.clientY - pointerOffsetY), maxY);
      sticker.style.left = `${x}px`;
      sticker.style.top = `${y}px`;
    });

    function releaseSticker(event) {
      sticker.classList.remove('is-dragging');
      if (sticker.hasPointerCapture(event.pointerId)) sticker.releasePointerCapture(event.pointerId);
    }

    sticker.addEventListener('pointerup', releaseSticker);
    sticker.addEventListener('pointercancel', releaseSticker);
  </script>
</body>
</html>
