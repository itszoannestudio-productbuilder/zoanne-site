<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zoanne, a creative product builder exploring AI tools.">
  <title>Zoanne</title>
  <style>
    body {
      margin: 0;
      padding: 48px 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #1a1a1a;
      background: #ffffff;
    }
    main { max-width: 70rem; margin: 0 auto; }
    h1 { font-size: 2.25rem; line-height: 1.15; margin: 0 0 16px; }
    p { margin: 0 0 16px; }
    a { color: inherit; }
    .note { color: #666666; font-size: 16px; }
    .book-stack {
      position: relative;
      width: min(520px, 88vw);
      height: 350px;
      margin: 56px auto 24px;
      perspective: 1100px;
      outline: none;
      isolation: isolate;
    }
    .book-stack::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: 12%; right: 12%; bottom: 13px;
      height: 34px;
      border-radius: 50%;
      background: rgba(38, 42, 48, .14);
      filter: blur(15px);
      transition: transform .5s ease, opacity .5s ease;
    }
    .book {
      --book-color: #d89b89;
      position: absolute;
      left: 50%;
      width: min(360px, 72vw);
      height: 112px;
      border: 2px solid rgba(45, 42, 38, .78);
      border-radius: 28px 35px 20px 31px;
      background:
        radial-gradient(ellipse at 21% 18%, rgba(255,255,255,.34), transparent 36%),
        repeating-linear-gradient(7deg, rgba(255,255,255,.045) 0 1px, rgba(45,35,27,.035) 1px 2px, transparent 2px 5px),
        linear-gradient(155deg, color-mix(in srgb, var(--book-color), white 13%), var(--book-color) 64%, color-mix(in srgb, var(--book-color), black 12%));
      box-shadow: 0 0 0 7px #fff, 0 0 0 9px rgba(39, 38, 37, .78), 0 13px 17px rgba(30, 28, 25, .18);
      transform: translate(-50%, 0) rotate(var(--angle));
      transform-origin: 50% 100%;
      transition: transform .55s cubic-bezier(.2,.75,.25,1), box-shadow .55s ease;
      will-change: transform;
    }
    .book::before {
      content: "";
      position: absolute;
      left: 12px; right: 12px; bottom: 10px;
      height: 35px;
      border-radius: 8px 12px 14px 8px;
      background: repeating-linear-gradient(180deg, #fffdf7 0 2px, #e9e5dc 2px 3px);
      box-shadow: inset 0 2px 4px rgba(90,72,52,.12), 0 2px 1px rgba(255,255,255,.6);
    }
    .book::after {
      content: attr(data-title);
      position: absolute;
      top: 21px; left: 30px; right: 22px;
      color: rgba(76, 51, 38, .82);
      font-size: 12px; font-weight: 750; letter-spacing: .11em;
    }
    .book:nth-child(1) { --book-color: #b66b4c; --angle: -3deg; top: 208px; z-index: 4; }
    .book:nth-child(2) { --book-color: #d19a58; --angle: 2deg; top: 160px; z-index: 3; }
    .book:nth-child(3) { --book-color: #839184; --angle: -2deg; top: 112px; z-index: 2; }
    .book:nth-child(4) { --book-color: #c98791; --angle: 3deg; top: 64px; z-index: 1; }
    .book-stack:hover .book:nth-child(1), .book-stack:focus-visible .book:nth-child(1) { transform: translate(-50%, 54px) translateZ(35px) rotate(-8deg) scale(1.02); }
    .book-stack:hover .book:nth-child(2), .book-stack:focus-visible .book:nth-child(2) { transform: translate(-50%, 18px) translateZ(55px) rotate(5deg) scale(1.02); }
    .book-stack:hover .book:nth-child(3), .book-stack:focus-visible .book:nth-child(3) { transform: translate(-50%, -19px) translateZ(80px) rotate(-5deg) scale(1.02); }
    .book-stack:hover .book:nth-child(4), .book-stack:focus-visible .book:nth-child(4) { transform: translate(-50%, -57px) translateZ(105px) rotate(7deg) scale(1.02); }
    .book-stack:hover::after, .book-stack:focus-visible::after { transform: scale(.82); opacity: .5; }
    .book-hint { margin: 0; text-align: center; color: #666; font-size: 14px; }
    @media (max-width: 520px) {
      body { padding: 34px 20px; }
      .book-stack { height: 300px; margin-top: 45px; }
      .book { height: 94px; border-radius: 25px 28px 20px 25px; }
      .book::before { height: 29px; }
      .book:nth-child(1) { top: 180px; }
      .book:nth-child(2) { top: 140px; }
      .book:nth-child(3) { top: 100px; }
      .book:nth-child(4) { top: 60px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .book, .book-stack::after { transition-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Zoanne</h1>
    <p>Hi! I'm a product builder who studying PMUX @SKEMA &amp; POLIMI.</p>
    <p class="note">This page is the start of my site. It will change a lot.</p>
    <div class="book-stack" tabindex="0" role="group" aria-label="Four colorful clay books stacked together. Hover or focus to see them float apart.">
      <div class="book" data-title="AI FIELD NOTES" aria-hidden="true"></div>
      <div class="book" data-title="PRODUCT THINKING" aria-hidden="true"></div>
      <div class="book" data-title="SMALL EXPERIMENTS" aria-hidden="true"></div>
      <div class="book" data-title="IDEAS IN PROGRESS" aria-hidden="true"></div>
    </div>
    <p class="book-hint">A few things I'm exploring — hover over the stack.</p>
  </main>

</body>
</html>
